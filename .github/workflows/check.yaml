name: Redis monitor checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Lists of actions and commands to execute
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Python syntax
        run: python3 -m py_compile app.py

      - name: Check shell syntax
        run: bash -n scripts/test-outage.sh

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Test Redis outage and recovery
        run: bash scripts/test-outage.sh
