services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15

  monitor:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app.py:/app/app.py:ro
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CHECK_INTERVAL: "2"
      FAILURE_THRESHOLD: "2"
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-u", "app.py"]
    
